[package]
name = "scriba"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
# Embute o modelo base, o VAD e a amostra usados pelo `--self-test` (release do CI).
embedded-test-model = ["scriba-model/embedded-test-model"]
# whisper.cpp com backend Vulkan (exige o Vulkan SDK no build): `cargo run --features vulkan`.
vulkan = ["whisper-rs/vulkan"]
# O pipeline falso (`FakePipeline`) e a flag `--fake-pipeline`, para o E2E e os testes que
# sobem o exe sem transcrever.
test-support = []

[dependencies]
scriba-model = { path = "crates/scriba-model" }
anyhow.workspace = true
askama.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
ffmpeg-next.workspace = true
getrandom.workspace = true
hex.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
whisper-rs.workspace = true
windows-sys.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower.workspace = true

# Sobe o exe com `--fake-pipeline`: o probe real recusaria os bytes do envio.
[[test]]
name = "upload"
required-features = ["test-support"]

[workspace]
members = ["crates/scriba-model", "crates/spikes", "xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "static"] }
getrandom = "0.4.3"
hex = "0.4.3"
hound = "3.5.1"
insta = "1.49.0"
open = "5.4.4"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
ureq = "3.4.2"
# `raw-api`: o registro de dispositivos do ggml, o VAD carregado da memória e o log.
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
# Hora local e fuso (GetLocalTime/GetSystemTime), a Lixeira (SHFileOperationW); nos testes, o
# pico de memória do processo.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
codegen-units = 1
