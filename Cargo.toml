[package]
name = "scriba"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
# Embute o modelo da CPU (small), o VAD e a amostra do `--self-test`: a release do CI, que
# transcreve no processador.
embedded-cpu-model = ["scriba-model/embedded-cpu-model"]
# whisper.cpp com backend Vulkan (exige o Vulkan SDK no build): `cargo run --features vulkan`.
vulkan = ["whisper-rs/vulkan"]
# O pipeline falso (`FakePipeline`) e a flag `--fake-pipeline`, para o E2E e os testes que
# sobem o exe sem transcrever.
test-support = []

[dependencies]
scriba-model = { path = "crates/scriba-model" }
anyhow.workspace = true
askama.workspace = true
axum.workspace = true
clap.workspace = true
cpal.workspace = true
dirs.workspace = true
ffmpeg-next.workspace = true
getrandom.workspace = true
futures-util.workspace = true
hex.workspace = true
hound.workspace = true
open.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
whisper-rs.workspace = true
windows.workspace = true
windows-sys.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower.workspace = true

# Sobe o exe com `--fake-pipeline`: o probe real recusaria os bytes do envio.
[[test]]
name = "upload"
required-features = ["test-support"]

# Sobe o exe com `--fake-pipeline`, que provoca o pânico no worker.
[[test]]
name = "logs"
required-features = ["test-support"]

# A saída pela rota e pelo fim da sessão, com `--fake-pipeline` e `--fake-audio`.
[[test]]
name = "app"
required-features = ["test-support"]

# O histórico com o `FakePipeline`, o `ScriptedDialog` e o `PrintOpener`.
[[test]]
name = "historico"
required-features = ["test-support"]

# A gravação com o `FakeSource` (os testes de hardware usam o cpal).
[[test]]
name = "capture"
required-features = ["test-support"]

[workspace]
members = ["crates/scriba-model", "crates/spikes", "xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
cpal = "0.18.2"
dirs = "7.0.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "static"] }
getrandom = "0.4.3"
hex = "0.4.3"
hound = "3.5.1"
# `cargo xtask icon`: os .ico do exe e da bandeja a partir dos SVGs da marca (sem texto: sem
# fontes).
ico = "0.6.0"
resvg = { version = "0.48.1", default-features = false }
insta = "1.49.0"
open = "5.4.4"
proptest = "1.12.0"
# Os ring buffers SPSC entre os callbacks de áudio e a thread de escrita da gravação.
rtrb = "0.4.0"
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
ureq = "3.4.2"
# `raw-api`: o registro de dispositivos do ggml, o VAD carregado da memória e o log.
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
# O "Salvar como" do Windows (`IFileSaveDialog`, COM tipado). Na gravação, o relógio dos pacotes
# (QPC) e o enumerador do dispositivo (Bluetooth), com features que o cpal já compila.
windows = { version = "0.62.2", features = ["Win32_Devices_Properties", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
# Hora local e fuso (GetLocalTime/GetSystemTime), a Lixeira (SHFileOperationW), o espaço livre em
# disco da gravação; os logs (handles padrão, pipes, filtro de falhas nativas, versão do Windows
# no registro) e a janela do erro fatal; a bandeja (janela oculta, ícone, menu, fim da sessão), o
# mutex da instância única e o console das flags de CLI; nos testes, o pico de memória do processo.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
# O ícone, a VERSIONINFO e o manifesto do exe (`build.rs`); sem o `toml`, que lê metadados do
# Cargo.toml que não usamos.
winresource = { version = "0.1.34", default-features = false }
