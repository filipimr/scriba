[package]
name = "scriba"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
# Embute o modelo base e a amostra usados pelo `--self-test` (release do CI).
embedded-test-model = ["scriba-model/embedded-test-model"]

[dependencies]
scriba-model = { path = "crates/scriba-model" }
anyhow.workspace = true
askama.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
ffmpeg-next.workspace = true
getrandom.workspace = true
hex.workspace = true
hound.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
whisper-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[workspace]
members = ["crates/scriba-model", "crates/spikes", "xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "static"] }
getrandom = "0.4.3"
hex = "0.4.3"
hound = "3.5.1"
insta = "1.49.0"
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
ureq = "3.4.2"
whisper-rs = "0.16.0"

[profile.release]
lto = "thin"
codegen-units = 1
