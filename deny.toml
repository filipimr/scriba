# cargo deny check: vulnerabilidades (RustSec) e licenças compatíveis com a GPL-3.0.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `basic-toml` sem manutenção: só o proc-macro do askama 0.16.1 (a versão mais nova) o
    # usa, para ler a configuração na compilação; não vai para o exe. Rever quando o
    # askama trocar de parser.
    { id = "RUSTSEC-2026-0374", reason = "dependência só de compilação do askama_derive" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "WTFPL",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
