name: setup-native
description: >
  Rust fixado, FFmpeg estático do vcpkg (com cache), cache do Cargo e os modelos pedidos
  (base e VAD nos testes; small e VAD na release).
  O target dir fica curto (C:\t): o build do whisper.cpp estoura MAX_PATH no repositório.

inputs:
  tools:
    description: Ferramentas cargo extras via taiki-e/install-action (separadas por vírgula).
    default: ""
  models:
    description: >
      Modelos para models/, como no `cargo xtask model --only` (vírgulas); vazio não baixa.
    default: "base,silero"
  vulkan:
    description: >
      Instala o Vulkan SDK (o mesmo da máquina de desenvolvimento), com cache por versão, e
      define o VULKAN_SDK: o build com a feature `vulkan` (release completa).
    default: "false"

runs:
  using: composite
  steps:
    - name: Ambiente do build
      shell: pwsh
      run: |
        "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
        "VCPKG_ROOT=C:\vcpkg-scriba" >> $env:GITHUB_ENV
        "CARGO_TERM_COLOR=always" >> $env:GITHUB_ENV
        # O LLVM vem pré-instalado no runner, no mesmo caminho de .cargo/config.toml.
        if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { throw "libclang ausente" }

    - name: Rust (rust-toolchain.toml)
      shell: pwsh
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustc --version

    - name: Cache do FFmpeg (vcpkg_installed)
      id: vcpkg-cache
      uses: actions/cache@v4
      with:
        path: vcpkg_installed
        key: vcpkg-x64-windows-static-release-${{ hashFiles('vcpkg.json', 'triplets/**') }}

    - name: FFmpeg estático (vcpkg)
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Clone completo: o modo manifesto resolve o builtin-baseline pelo histórico do git.
        git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-release --x-install-root=vcpkg_installed
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: Salvar cache do FFmpeg mesmo se o job falhar depois
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: vcpkg_installed
        key: vcpkg-x64-windows-static-release-${{ hashFiles('vcpkg.json', 'triplets/**') }}

    - name: Cache do Vulkan SDK
      if: inputs.vulkan == 'true'
      id: vulkan-cache
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK\1.4.363.0
        key: vulkan-sdk-1.4.363.0

    # O instalador também põe o vulkan-1.dll no System32; do cache, só o SDK volta (o build
    # não precisa do runtime).
    - name: Vulkan SDK
      if: inputs.vulkan == 'true' && steps.vulkan-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ver = "1.4.363.0"
        $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
        $names = @("vulkansdk-windows-X64-$ver.exe", "VulkanSDK-$ver-Installer.exe")
        foreach ($name in $names) {
          try {
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/$name" -OutFile $exe
            break
          } catch { Write-Host "não achei $name" }
        }
        if (-not (Test-Path $exe)) { throw "não consegui baixar o Vulkan SDK $ver" }
        & $exe --root "C:\VulkanSDK\$ver" --accept-licenses --default-answer --confirm-command install | Out-Host
        if (-not (Test-Path "C:\VulkanSDK\$ver\Bin\glslc.exe")) { throw "Vulkan SDK sem glslc" }

    - name: VULKAN_SDK
      if: inputs.vulkan == 'true'
      shell: pwsh
      run: |
        "VULKAN_SDK=C:\VulkanSDK\1.4.363.0" >> $env:GITHUB_ENV
        "C:\VulkanSDK\1.4.363.0\Bin" >> $env:GITHUB_PATH

    # A release (Vulkan, flags do whisper.cpp) tem o próprio cache: o whisper.cpp só vem dele
    # com as mesmas flags do .cargo/config.toml.
    - name: Cache do Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> C:\\t"
        prefix-key: ${{ inputs.vulkan == 'true' && format('v0-rust-vulkan-{0}', hashFiles('.cargo/config.toml')) || 'v0-rust' }}

    - name: Ferramentas cargo
      if: inputs.tools != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    # O xtask/src/models.rs guarda o SHA-256 de cada modelo: trocar um invalida a chave. A
    # chave não aceita vírgulas.
    - name: Chave do cache dos modelos
      if: inputs.models != ''
      id: model-key
      shell: pwsh
      run: |
        $list = "${{ inputs.models }}" -replace '\s', '' -replace ',', '-'
        "key=models-$list-${{ hashFiles('xtask/src/models.rs') }}" >> $env:GITHUB_OUTPUT

    - name: Cache dos modelos (${{ inputs.models }})
      if: inputs.models != ''
      id: model-cache
      uses: actions/cache@v4
      with:
        path: models/ggml-*.bin
        key: ${{ steps.model-key.outputs.key }}

    - name: Baixar os modelos
      if: inputs.models != '' && steps.model-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: cargo xtask model --only "${{ inputs.models }}"
