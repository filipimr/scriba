name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  # Semanal na `main`: renova os caches antes dos 7 dias sem acesso que o GitHub
  # tolera e pega quebras do runner e avisos novos do RustSec.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # Sem paths-ignore no PR: os checks são obrigatórios na `main`, e um PR que não
  # os roda (só .md) ficaria bloqueado para sempre.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    # Sem cache, o FFmpeg compila em ~11–17 min; depois vem do cache.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-native
        with:
          tools: cargo-nextest,cargo-llvm-cov

      - name: fmt
        run: cargo fmt --all --check

      # Sem a feature vulkan: o runner não tem Vulkan SDK nem GPU. A `test-support` traz o
      # pipeline falso, usado pelo E2E e pelo teste de upload.
      - name: clippy
        run: cargo clippy --workspace --all-targets --features scriba/test-support -- -D warnings

      - name: CSS em dia com o DESIGN-scriba.md
        run: cargo xtask css --check

      # Fora da cobertura: os spikes, o xtask e o adaptador do cpal (`capture/wasapi.rs`), que
      # só roda com placa de som; ele é coberto pela suíte local de hardware.
      - name: Testes (unit + integração) com cobertura
        run: >
          cargo llvm-cov nextest --workspace --profile ci --features scriba/test-support
          --ignore-filename-regex "crates[/\\\\]spikes|xtask|src[/\\\\]capture[/\\\\]wasapi"
          --fail-under-lines 90
          --lcov --output-path lcov.info

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes
          path: |
            C:\t\nextest\ci\junit.xml
            lcov.info
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # O E2E sobe o scriba.exe de debug (em CARGO_TARGET_DIR) no Edge do runner, com o
      # pipeline falso (`--fake-pipeline`).
      - name: Build do app para o E2E
        run: cargo build --features test-support

      - name: E2E (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright test

      - name: Resultados e referências do E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            e2e/test-results
            e2e/tests/*-snapshots
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
