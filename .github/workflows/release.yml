name: Release

on:
  push:
    tags: ["v*"]
  # Fora da tag, build, self-test e dumpbin sem publicar nada: no PR que mexe na release e
  # sob demanda (`gh workflow run release.yml --ref <branch>`).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-native/**
      - crates/scriba-model/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-native
        with:
          tools: cargo-about
          models: small,silero

      - name: Tag confere com a versão do Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq scriba).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} difere da versão v$version do Cargo.toml"
          }

      # O build script do whisper-rs-sys não rastreia as flags CMAKE_* do .cargo/config.toml:
      # sem o clean, o rust-cache traria um whisper.cpp compilado com flags antigas.
      - name: Limpar o whisper.cpp do cache
        run: cargo clean -p whisper-rs-sys --release

      # O modelo da CPU (small) embutido: o app transcreve no processador e o self-test o
      # usa. O modelo grande e o Vulkan entram na Fase 7.
      - name: Build
        run: cargo build --release --features embedded-cpu-model

      - name: Smoke test
        shell: pwsh
        env:
          # O small otimizado transcreve a amostra em ~6 s no runner; sem /O2 levaria ~48 s.
          SCRIBA_SELF_TEST_MAX_SECS: "15"
        run: |
          Copy-Item C:\t\release\scriba.exe scriba.exe
          .\scriba.exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sem DLLs do FFmpeg
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents scriba.exe
          $deps
          if ($deps -match '(?i)\b(av\w+|sw\w+|postproc)-\d+\.dll') { throw "o exe depende de DLLs do FFmpeg" }

      - name: Checksum e licenças
        shell: pwsh
        run: |
          $hash = (Get-FileHash scriba.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  scriba.exe" | Out-File -Encoding ascii scriba.exe.sha256
          cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Tamanho do exe
        shell: pwsh
        run: '"{0:N0} MB" -f ((Get-Item scriba.exe).Length / 1MB)'

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            scriba.exe
            scriba.exe.sha256
            THIRD_PARTY_LICENSES.html
            LICENSE
