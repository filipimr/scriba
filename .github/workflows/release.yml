name: Release

on:
  push:
    tags: ["v*"]
  # Fora da tag, o build, os três smokes e o dumpbin sem publicar nada: no PR que mexe na
  # release e sob demanda (`gh workflow run release.yml --ref <branch>`). O exe vai como
  # artifact do workflow (o Sandbox da etapa 7.5 o usa).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-native/**
      - crates/scriba-model/**
      - build.rs
      - scripts/smoke.ps1
      - src/delay_load.rs
      - src/self_test.rs
      - xtask/src/dist.rs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-native
        with:
          tools: cargo-about
          models: large,small,silero
          vulkan: "true"

      - name: Tag confere com a versão do Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq scriba).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} difere da versão v$version do Cargo.toml"
          }

      # O mesmo build da máquina de desenvolvimento: Vulkan, o large e o small embutidos, o
      # SHA-256, as licenças, o dumpbin, a VERSIONINFO e o --self-test (smoke 1). O runner
      # não tem GPU: o self-test prova o recuo para a CPU. O cache do Cargo já é separado
      # pelo hash do .cargo/config.toml (setup-native), então o whisper.cpp não é limpo.
      - name: Build (cargo xtask dist) e --self-test
        env:
          SCRIBA_SELF_TEST_EXPECT: cpu
          # O small otimizado transcreve a amostra em ~6 s no runner; sem /O2 levaria ~48 s.
          SCRIBA_SELF_TEST_MAX_SECS: "15"
        run: cargo xtask dist --trust-cache

      # Smoke 2: o app de verdade, pelas rotas (envio, log, segunda instância e saída).
      - name: Smoke pelas rotas
        shell: pwsh
        run: |
          .\scripts\smoke.ps1 -Exe dist\scriba.exe -Fixtures tests\fixtures -Out "$env:RUNNER_TEMP\smoke"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Smoke 3: sem o vulkan-1.dll (uma máquina sem driver de GPU), o exe abre e transcreve
      # na CPU pelo delay-load.
      - name: Sem o vulkan-1.dll
        shell: pwsh
        env:
          SCRIBA_SELF_TEST_EXPECT: cpu
          SCRIBA_SELF_TEST_MAX_SECS: "15"
        run: |
          $dll = "$env:SystemRoot\System32\vulkan-1.dll"
          if (Test-Path $dll) {
            takeown /f $dll | Out-Null
            icacls $dll /grant "*S-1-5-32-544:F" | Out-Null
            Rename-Item $dll "vulkan-1.dll.escondido"
            Write-Host "vulkan-1.dll renomeado no System32"
          }
          $handle = [IntPtr]::Zero
          if ([System.Runtime.InteropServices.NativeLibrary]::TryLoad("vulkan-1.dll", [ref]$handle)) {
            throw "o vulkan-1.dll ainda é achado"
          }
          $out = .\dist\scriba.exe --self-test | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code) { exit $code }
          if ($out -notmatch "vulkan-1.dll: ausente") { throw "o self-test não viu a falta do vulkan-1.dll" }

      - name: Tamanhos
        if: always()
        shell: pwsh
        run: |
          function Mb($path) {
            if (-not (Test-Path $path)) { return "ausente" }
            $bytes = (Get-ChildItem $path -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            "{0:N0} MB" -f ($bytes / 1MB)
          }
          "exe:              $(Mb dist\scriba.exe)"
          "target (C:\t):    $(Mb C:\t)"
          "modelos:          $(Mb models)"
          "FFmpeg (vcpkg):   $(Mb vcpkg_installed)"
          "Vulkan SDK:       $(Mb C:\VulkanSDK)"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: scriba-exe
          retention-days: 14
          path: |
            dist/scriba.exe
            dist/scriba.exe.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          retention-days: 14
          path: ${{ runner.temp }}/smoke

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/scriba.exe
            dist/scriba.exe.sha256
            dist/THIRD_PARTY_LICENSES.html
            LICENSE
