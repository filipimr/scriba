# O whisper usa todos os núcleos; em paralelo os testes disputam a CPU (spike A: 3 testes
# base levaram 498 s). Testes que transcrevem rodam um por vez.
[test-groups]
whisper = { max-threads = 1 }
# A gravação com a fonte falsa corre com o relógio acelerado: poucos de cada vez, para a
# thread de escrita não ficar sem CPU.
captura = { max-threads = 2 }

[[profile.default.overrides]]
filter = "binary(spike_a_whisper) | binary(self_test) | binary(asr) | binary(bench_asr) | binary(engine)"
test-group = "whisper"

[[profile.default.overrides]]
filter = "binary(capture)"
test-group = "captura"

[profile.ci]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"
