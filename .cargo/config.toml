[alias]
xtask = "run --package xtask --"

[env]
# FFmpeg estático do vcpkg (modo manifesto, instalado em vcpkg_installed/).
VCPKGRS_TRIPLET = "x64-windows-static-md"
VCPKGRS_DYNAMIC = "0"
VCPKG_INSTALLED_DIR = { value = "vcpkg_installed", relative = true }
FFMPEG_DIR = { value = "vcpkg_installed/x64-windows-static-md", relative = true }
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"

# whisper.cpp: com MSVC o GGML_NATIVE não detecta a CPU e compila sem SIMD.
# Base fixa x86-64-v3 (AVX2/FMA/F16C), presente em PCs desde ~2013.
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
