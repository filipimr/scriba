<!doctype html>
<html lang="pt-BR"{% if let Some(t) = theme.attr() %} data-theme="{{ t }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <title>{% block title %}Scriba{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ layout.favicon }}">
  <link rel="stylesheet" href="{{ layout.css }}">
</head>
<body>
  <header class="app-header">
    <div class="container-page flex h-full items-center justify-between">
      <a href="/" class="flex items-center gap-xs text-on-dark">
        <img src="{{ layout.logo }}" alt="" width="24" height="24">
        <span class="wordmark text-body max-[479px]:hidden">Scriba</span>
      </a>
      {% include "partials/theme_toggle.html" %}
    </div>
  </header>

  <main class="container-page flex-1 py-xxl">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container-page flex flex-wrap justify-between gap-xs">
      <span>Scriba {{ layout.version }}</span>
      <span>Funciona offline · nada sai do seu computador</span>
    </div>
  </footer>

  <script src="{{ layout.htmx }}"></script>
  <script src="{{ layout.js }}"></script>
</body>
</html>
